<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28723" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3557" />
      <stop offset="100%" stop-color="#0F1E33" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Base Shield -->
    <path d="M52 4 L96 22 V64 C96 86 52 102 52 102 C52 102 8 86 8 64 V22 Z" fill="url(#shieldGrad)" stroke="#E28723" stroke-width="2.5" />
    
    <!-- Inner Accent Rim -->
    <path d="M52 12 L88 27 V62 C88 80 52 93 52 93 C52 93 16 80 16 62 V27 Z" fill="none" stroke="#25446C" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Stylized House Gable / Roof -->
    <path d="M26 48 L52 26 L78 48" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M52 20 L52 14" stroke="#E28723" stroke-width="3" stroke-linecap="round" />

    <!-- Craftsman Hammer & Wrench Tool Cross -->
    <!-- Wrench -->
    <path d="M38 72 L66 44" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="68" cy="42" r="4.5" fill="none" stroke="#94A3B8" stroke-width="3" />
    
    <!-- Hammer -->
    <path d="M66 72 L42 48" stroke="#E28723" stroke-width="4" stroke-linecap="round" />
    <!-- Hammer head -->
    <path d="M36 42 L48 54 L44 58 L32 46 Z" fill="url(#roofGrad)" />

    <!-- Central Precision Star -->
    <polygon points="52,48 54,54 60,54 55,58 57,64 52,60 47,64 49,58 44,54 50,54" fill="#F59E0B" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(130, 26)">
    <!-- Primary Name: ESPINO'S -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" fill="#11233B" letter-spacing="1">ESPINO'S</text>
    
    <!-- Accent Dot -->
    <circle cx="206" cy="24" r="4.5" fill="#E28723" />
    
    <!-- Secondary Name: HOME REPAIRS -->
    <text x="0" y="62" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="19" fill="#E28723" letter-spacing="3.5">HOME REPAIRS</text>
    
    <!-- Subtitle Badge / Location Tagline -->
    <g transform="translate(0, 74)">
      <!-- Pill Badge Background -->
      <rect x="0" y="0" width="370" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#16A34A" />
      <text x="24" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569" letter-spacing="0.5">FUQUAY-VARINA HANDYMAN &amp; REMODELING</text>
    </g>
  </g>
</svg>
