    <text x="40" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#FFFFFF">Request a Quick Photo Quote →</text>
  </g>

  <g transform="translate(580, 440)">
    <rect width="320" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <text x="36" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#E2E8F0">Call: (919) 555-0184</text>
  </g>
